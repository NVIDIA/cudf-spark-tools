# A workflow to run SonarQube analysis for rapids tools
name: SonarQube analysis

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to scan (for example, dev or release/26.10)
        required: true
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.branch }}
  cancel-in-progress: true

jobs:
  sonar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    steps:
      - name: Checkout code
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.event.pull_request.head.sha || format('refs/heads/{0}', inputs.branch) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SONAR_HOST_URL" || -z "$SONAR_TOKEN" ]]; then
            echo "::error::SONAR_HOST_URL and SONAR_TOKEN must be available. Public fork PR runs do not receive repository secrets."
            exit 1
          fi

      - name: Check SonarQube connectivity
        shell: bash
        run: |
          version=$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            "$SONAR_HOST_URL/api/server/version")
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "::error::SonarQube did not return a valid server version."
            exit 1
          fi
          echo "SonarQube version: $version"

      - name: Read project metadata
        id: metadata
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          version = ET.parse("core/pom.xml").getroot().findtext(
              "{http://maven.apache.org/POM/4.0.0}version"
          )
          if not version:
              raise SystemExit("Missing core/pom.xml project.version")
          print("value=" + version.strip())
          PY
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: SonarQube PR analysis
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.3.0.16463
          args: >-
            -Dsonar.projectKey=GPUSW_SPMD_spark-rapids_cudf-spark-tools
            -Dsonar.projectName=cudf-spark-tools
            -Dsonar.projectVersion=${{ steps.metadata.outputs.value }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
            -Dsonar.scm.revision=${{ steps.metadata.outputs.revision }}

      - name: SonarQube branch analysis
        if: github.event_name == 'workflow_dispatch'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scannerVersion: 8.3.0.16463
          args: >-
            -Dsonar.projectKey=GPUSW_SPMD_spark-rapids_cudf-spark-tools
            -Dsonar.projectName=cudf-spark-tools
            -Dsonar.projectVersion=${{ steps.metadata.outputs.value }}
            -Dsonar.branch.name=${{ inputs.branch }}
            -Dsonar.scm.revision=${{ steps.metadata.outputs.revision }}
