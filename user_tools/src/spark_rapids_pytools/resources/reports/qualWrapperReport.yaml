# This file is used to define the reports generated by the Qualification wrapper tool.

# The directory structure of the generated output files is as follows:
#
# qual_<YYYYmmddHHmmss>_<0x%08X>/
# ├── app_metadata.json
# ├── qual_core_stderr.log
# ├── qualification_statistics.csv
# ├── qualification_summary.csv
# ├── instance_predictions.csv (only when target instance types are given)
# ├── xgboost_predictions/*
# ├── intermediate_output/*
# ├── qual_core_output (qualCoreReport)
#     ├── <qualCoreReport>

reportDefinitions:
  - reportId: qualWrapperOutput
    description: >-
      TBD
    scope: global
    nestedReports:
      - reportId: qualCoreOutput
        relativePath: qual_core_output
    tableDefinitions:
      - label: qualWrapperAppMetadataJson
        description: >-
          Contains metadata for each qualified application including cluster information,
          runtime details, and GPU speedup recommendations.
        fileName: app_metadata.json
        fileFormat: JSON
        scope: global
        columns:
          - name: appId
            dataType: String
            description: >-
              The application ID
          - name: appName
            dataType: String
            description: >-
              The application name
          - name: eventLog
            dataType: String
            description: >-
              Path to the application event log
          - name: clusterInfo
            dataType: Object
            description: >-
              Cluster configuration information including platform and cluster details
          - name: sparkRuntime
            dataType: String
            description: >-
              The Spark runtime type (e.g., SPARK, Databricks)
          - name: estimatedGpuSpeedupCategory
            dataType: String
            description: >-
              Category of estimated GPU speedup (e.g., Small, Medium, Large, Very Large)
          - name: fullClusterConfigRecommendations
            dataType: String
            description: >-
              Full cluster configuration recommendations as a string
          - name: gpuConfigRecommendationBreakdown
            dataType: String
            description: >-
              Detailed breakdown of GPU configuration recommendations
      - label: qualWrapperCSVSummary
        description: >-
          TBD
        fileName: qualification_summary.csv
        scope: global
        columns:
          - name: Vendor
            dataType: String
            description: >-
              TBD
          - name: Driver Host
            dataType: String
            description: >-
              TBD
          - name: App Name
            dataType: String
            description: >-
              TBD
          - name: App ID
            dataType: String
            description: >-
              TBD
          - name: Estimated GPU Speedup
            dataType: Float
            description: >-
              TBD
          - name: Estimated GPU Duration
            dataType: Long
            description: >-
              TBD
          - name: App Duration
            dataType: Long
            description: >-
              TBD
          - name: SQL Stage Durations Sum
            dataType: Long
            description: >-
              TBD
          - name: Unsupported Operators Stage Duration
            dataType: Long
            description: >-
              TBD
          - name: Unsupported Operators Stage Duration Percent
            dataType: Float
            description: >-
              TBD
          - name: Total Core Seconds
            dataType: Long
            description: >-
              TBD
          - name: Skip by Heuristics
            dataType: Boolean
            description: >-
              TBD
          - name: Not Recommended Reason
            dataType: String
            description: >-
              TBD
          - name: Spark Runtime
            dataType: String
            description: >-
              TBD
          - name: Estimated GPU Speedup Category
            dataType: String
            description: >-
              TBD
          - name: GPU Eligible
            dataType: Boolean
            description: >-
              Whether the app meets the eligibility conditions other than the speedup bound, and is
              not skipped by heuristics.
      - label: qualWrapperCSVInstancePredictions
        description: >-
          Estimated GPU speedup per app and target GPU instance type, written only when target
          instance types are given. Each estimate is derived from the prediction model's estimate,
          using the instance type's adjustment in the instance adjustments file.
        fileName: instance_predictions.csv
        scope: global
        columns:
          - name: App ID
            dataType: String
            description: >-
              The application ID.
          - name: Instance Type
            dataType: String
            description: >-
              A target GPU instance type.
          - name: Estimated GPU Speedup
            dataType: Float
            description: >-
              Estimated speedup on the instance type; empty when Status is failed.
          - name: Estimated GPU Duration
            dataType: Long
            description: >-
              Estimated application duration on the instance type; empty when Status is failed.
          - name: Status
            dataType: String
            description: >-
              ok, or failed when the prediction model could not predict the application.
          - name: Source
            dataType: String
            description: >-
              How the estimate was derived from the prediction model's estimate, for example linear(0.7, sql).
